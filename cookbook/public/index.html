<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><title>My Cookbook</title>
    <style>
        body { background-color: #f4f1ea; background-image: radial-gradient(#d1d1d1 1px, transparent 1px); background-size: 20px 20px; display: flex; flex-direction: row-reverse; gap: 30px; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        #sidebar { width: 220px; position: sticky; top: 20px; height: fit-content; background: rgba(255,255,255,0.7); padding: 20px; border-radius: 12px; border: 1px solid #ddd; backdrop-filter: blur(5px); }
        #main-content { flex: 1; background: white; padding: 40px; box-shadow: 5px 5px 15px rgba(0,0,0,0.05); border-radius: 8px; border: 1px solid #e0e0e0; max-width: 900px; }
        .filter-btn, .tag-item { width: 100%; text-align: left; background: none; border: none; padding: 8px; cursor: pointer; border-radius: 4px; display: block; }
        .filter-btn.active, .tag-item.active { background: #4a6741; color: white; }
        .recipe { position: relative; margin-bottom: 40px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .fav-star { position: absolute; left: -35px; top: 5px; cursor: pointer; font-size: 24px; color: #ccc; }
        .fav-star.active { color: #f1c40f; }
        .qty-input { width: 50px; display: none; }
        .recipe:not(.editing) li:hover .qty-input { display: inline-block; }
        .recipe:not(.editing) li:hover .qty-display { display: none; }
        .tag-edit { width: 100%; margin-top: 10px; padding: 5px; border: 1px dashed #ccc; display: none; }
        .editing .tag-edit { display: block; }
        .hidden { display: none; }
        .section-header { cursor: pointer; background: #f9f9f9; padding: 10px; border-left: 5px solid #4a6741; margin-top: 30px; font-size: 1.4em; }
        #searchInput { width: 100%; padding: 12px; border-radius: 25px; border: 1px solid #ddd; margin-bottom: 20px; outline: none; }
        .edit-controls button { margin-right: 5px; cursor: pointer; padding: 5px 10px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Categories</h2><div id="cat-filters"></div>
        <h2>Tags</h2><div id="tag-filters"></div>
    </div>
    <div id="main-content">
        <h1>Chef's Notebook</h1>
        <input type="text" id="searchInput" placeholder="Search title, ingredient, or #tag...">
        <div id="recipes"></div>
    </div>

<script>
let recipesData = [], activeCat = null, activeTag = null;

function getFraction(val, isDisc) {
    if (!val || val <= 0) return "0";
    if (isDisc) return Math.round(val).toString();
    const fracs = [{d:.25,s:"1/4"},{d:.33,s:"1/3"},{d:.5,s:"1/2"},{d:.66,s:"2/3"},{d:.75,s:"3/4"}];
    const match = fracs.find(f => Math.abs(f.d - (val % 1)) < 0.03);
    const whole = Math.floor(val);
    return match ? (whole > 0 ? `${whole} ${match.s}` : match.s) : (val % 1 === 0 ? whole : val.toFixed(2));
}

async function toggleFav(r) {
    r.tags = r.tags.includes("favorite") ? r.tags.filter(t => t !== "favorite") : [...r.tags, "favorite"];
    await fetch("/api/recipes/save", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(r) });
    fetchRecipes();
}

function renderFilters() {
    const cats = document.getElementById("cat-filters"); cats.innerHTML = "";
    const tags = document.getElementById("tag-filters"); tags.innerHTML = "";

    ["All", ...new Set(recipesData.map(r => r.section))].forEach(s => {
        const b = document.createElement("button"); b.textContent = s; b.className = `filter-btn ${activeCat === (s==="All"?null:s) ? 'active' : ''}`;
        b.onclick = () => { activeCat = (s==="All"?null:s); renderAll(); renderFilters(); };
        cats.appendChild(b);
    });

    [...new Set(recipesData.flatMap(r => r.tags))].sort().forEach(t => {
        const b = document.createElement("button"); b.textContent = "#" + t; b.className = `tag-item ${activeTag === t ? 'active' : ''}`;
        b.onclick = () => { activeTag = (activeTag === t ? null : t); renderAll(); renderFilters(); };
        tags.appendChild(b);
    });
}

function renderAll() {
    const container = document.getElementById("recipes"); container.innerHTML = "";
    const search = document.getElementById("searchInput").value.toLowerCase();
    const filtered = recipesData.filter(r => (!activeCat || r.section === activeCat) && (!activeTag || r.tags.includes(activeTag)) &&
        (!search || `${r.title} ${r.ingredients.map(i=>i.name).join(" ")} #${r.tags.join(" #")}`.toLowerCase().includes(search)));

    const grouped = {};
    filtered.forEach(r => { (grouped[r.section] = grouped[r.section] || []).push(r); });

    Object.keys(grouped).forEach(sec => {
        const h = document.createElement("div"); h.className = "section-header"; h.textContent = sec;
        const wrap = document.createElement("div");
        grouped[sec].forEach(r => wrap.appendChild(renderRecipe(r)));
        container.append(h, wrap);
    });
}

function renderRecipe(r) {
    const div = document.createElement("div"); div.className = "recipe";
    let scale = 1, curIngs = JSON.parse(JSON.stringify(r.ingredients));

    div.innerHTML = `
        <span class="fav-star ${r.tags.includes('favorite')?'active':''}">★</span>
        <h3 class="title">${r.title}</h3>
        <div class="edit-controls"><button class="e-btn">Edit</button><button class="s-btn hidden">Save</button></div>
        <input type="text" class="tag-edit" value="${r.tags.join(', ')}" placeholder="tags (comma separated)">
        <div class="tag-display" style="font-size:0.8em; color:#666; margin:5px 0;">${r.tags.map(t=>'#'+t).join(' ')}</div>
        <ul class="ings-list"></ul>
        <ol class="dirs-list">${r.directions.map(d => `<li>${d}</li>`).join("")}</ol>
    `;

    const list = div.querySelector(".ings-list");
    div.querySelector(".fav-star").onclick = () => toggleFav(r);

    const drawIngs = () => {
        list.innerHTML = "";
        curIngs.forEach((ing, i) => {
            const li = document.createElement("li");
            if (!ing.scalable) li.textContent = ing.name;
            else {
                const isD = /eggs?|cloves?/i.test(ing.name) || /cloves?/i.test(ing.unit);
                li.innerHTML = `<input type="number" class="qty-input" value="${ing.qty}" step="${isD?1:0.25}">
                                <span class="qty-display">${getFraction(ing.qty, isD)}</span> <span class="it">${ing.unit||""} ${ing.name}</span>`;
                li.querySelector("input").onchange = (e) => {
                    scale = e.target.value / r.ingredients[i].qty;
                    curIngs = r.ingredients.map(x => x.scalable ? {...x, qty: x.qty * scale} : x);
                    drawIngs();
                };
            }
            list.appendChild(li);
        });
    };

    div.querySelector(".e-btn").onclick = (e) => {
        div.classList.add("editing"); e.target.classList.add("hidden"); div.querySelector(".s-btn").classList.remove("hidden");
        div.querySelector(".title").contentEditable = true;
        div.querySelectorAll(".dirs-list li").forEach(li => li.contentEditable = true);
    };

    div.querySelector(".s-btn").onclick = async () => {
        r.title = div.querySelector(".title").innerText.trim();
        r.tags = div.querySelector(".tag-edit").value.split(",").map(t => t.trim()).filter(t => t);
        r.directions = [...div.querySelectorAll(".dirs-list li")].map(li => li.innerText.trim());
        r.ingredients = curIngs.map(ing => ({...ing, qty: ing.qty / scale}));
        await fetch("/api/recipes/save", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(r) });
        fetchRecipes();
    };

    drawIngs(); return div;
}

function fetchRecipes() {
    fetch("/api/recipes").then(r => r.json()).then(d => { recipesData = d; renderFilters(); renderAll(); });
}
fetchRecipes();
document.getElementById("searchInput").oninput = renderAll;
</script>
</body>
</html>
